<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devocional Bíblico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor-principal">
        
        <div class="header-superior">
            <span class="badge-actualizacion">Actualizado noviembre 2026 🌙</span>
            <button class="btn-modo-toggle" onclick="toggleModoOscuro()">
                <span id="icono-modo">🌙</span>
            </button>
        </div>

        <h1 class="titulo-pagina">Devocional Bíblico</h1>

        <!-- Tu menú desplegable original con la opción de Ver Todo agregada arriba -->
        <div class="seccion-selector">
            <label for="filtro-estado">Estado de ánimo:</label>
            <select id="filtro-estado" onchange="seleccionarFiltro()">
                <option value="todos">-- Ver todas las fuentes / Todo --</option>
                <!-- Las opciones de Sheets se cargan aquí abajo automáticamente -->
            </select>
        </div>

        <!-- Contenedor donde se despliegan tus datos -->
        <div id="contenedor-datos"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
