<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devocional Bíblico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor-principal">
        
        <!-- Encabezado -->
        <div class="header-superior">
            <span class="badge-actualizacion">Actualizado noviembre 2026 🌙</span>
            <button class="btn-modo-toggle" onclick="toggleModoOscuro()">
                <span id="icono-modo">🌙</span>
            </button>
        </div>

        <h1 class="titulo-pagina">Devocional Bíblico</h1>

        <!-- Sección de Filtro con la opción de Ver Todos -->
        <div class="seccion-filtro">
            <label for="filtro-estado">Filtrar Versículos / Devocionales:</label>
            <select id="filtro-estado" onchange="filtrarRegistros()">
                <option value="todos">🌐 Ver todas las fuentes guardadas</option>
                <!-- Las opciones de estado de ánimo se cargarán aquí automáticamente -->
            </select>
        </div>

        <!-- Contenedor donde se mostrarán los resultados -->
        <div id="resultado-busqueda" class="contenedor-resultados">
            <!-- Aquí aparecerán los versículos cargados dinámicamente -->
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
